<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1877f2">
<meta name="description" content="ADAM MK CHAT - Connect, Share and Communicate with the World">
<title>ADAM MK CHAT</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --blue:#1877f2;
 --dark:#0756bd;
 --bg:#f1f5fb;
 --card:#ffffff;
 --text:#172b4d;
 --muted:#65758b;
 --light:#eaf3ff;
 --border:#dce5f0;
}
body.dark-mode{
 --bg:#0f172a;
 --card:#1e293b;
 --text:#f1f5f9;
 --muted:#94a3b8;
 --light:#334155;
 --border:#334155;
}
body{
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
 background:var(--bg);
 color:var(--text);
 min-height:100vh;
 transition:background 0.2s,color 0.2s;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{width:20px;height:20px;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

header{
 background:var(--blue);
 color:white;
 padding:14px 16px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 position:sticky;
 top:0;
 z-index:20;
 box-shadow:0 2px 8px rgba(0,0,0,0.15);
}
.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:bold}
.logo{
 width:38px;height:38px;
 background:white;color:var(--blue);
 border-radius:11px;display:grid;place-items:center;
 font-size:16px;font-weight:800;position:relative;
}
.logo:after{
 content:"";position:absolute;bottom:-4px;right:6px;
 border-width:6px 6px 0 0;border-style:solid;
 border-color:white transparent transparent transparent;
}
.header-actions{display:flex;gap:12px;align-items:center}
.header-actions button{
 background:rgba(255,255,255,0.15);border:0;color:white;
 width:36px;height:36px;border-radius:50%;
 display:grid;place-items:center;position:relative;
}
.container{max-width:1050px;margin:auto;padding:15px}
.hidden{display:none!important}
.card{
 background:var(--card);border:1px solid var(--border);
 border-radius:14px;padding:15px;margin-bottom:14px;
}
.auth{max-width:420px;margin:30px auto}
.auth h2{text-align:center;color:var(--blue);margin-bottom:6px}
.auth p{text-align:center;color:var(--muted);margin-bottom:20px;font-size:14px}
.form-group{margin-bottom:14px}
.form-group label{display:block;margin-bottom:6px;font-weight:600;font-size:13px}
.form-group input,.form-group textarea{
 width:100%;padding:12px;border:1px solid var(--border);
 border-radius:9px;outline:none;background:var(--bg);
}
.form-group input:focus,.form-group textarea:focus{border-color:var(--blue)}
.primary{
 width:100%;background:var(--blue);color:white;
 border:0;padding:12px;border-radius:9px;font-weight:bold;
}
.primary:hover{background:var(--dark)}
.link{
 color:var(--blue);cursor:pointer;font-weight:600;
 background:none;border:0;display:inline-flex;align-items:center;gap:5px;
}
.auth-footer{text-align:center;margin-top:17px;font-size:14px}
.top-profile{display:flex;align-items:center;gap:12px}
.avatar{
 width:44px;height:44px;border-radius:50%;
 background:#d9eaff;color:var(--blue);
 display:grid;place-items:center;font-weight:bold;flex-shrink:0;
}
.status-area{display:flex;gap:12px;overflow-x:auto;padding:4px 0 8px}
.status-item{min-width:72px;max-width:72px;text-align:center;cursor:pointer}
.status-ring{
 width:60px;height:60px;border:2.5px solid var(--blue);
 padding:2px;border-radius:50%;margin:0 auto 6px;
}
.status-ring .avatar{width:100%;height:100%}
.status-item small{font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.add-status{background:var(--light);color:var(--blue);font-size:24px}
.section-title{font-size:16px;font-weight:bold;margin-bottom:12px}
.create-post{display:flex;gap:10px;align-items:center}
.create-post input{
 flex:1;min-width:0;padding:12px 16px;
 border:1px solid var(--border);border-radius:25px;background:var(--bg);outline:none;
}
.media-preview{
 margin-top:10px;padding:8px 12px;background:var(--bg);
 border-radius:9px;display:flex;justify-content:space-between;align-items:center;font-size:13px;
}
.post-tools{
 margin-top:12px;padding-top:10px;border-top:1px solid var(--border);
 display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
}
.post-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.post-header .details{flex:1}
.post-header small{color:var(--muted);font-size:12px}
.post-text{line-height:1.5;margin:10px 0;white-space:pre-wrap}
.post-media{width:100%;max-height:420px;object-fit:cover;border-radius:10px;margin-top:8px}
audio.post-audio{width:100%;margin-top:8px}
.post-actions{
 display:flex;justify-content:space-around;
 border-top:1px solid var(--border);padding-top:10px;margin-top:12px;
}
.post-actions button{
 background:none;border:0;color:var(--muted);
 font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px;
 padding:5px 10px;border-radius:6px;
}
.post-actions button.liked{color:#ef4444}
.comments-box{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.comment-item{background:var(--bg);padding:8px 12px;border-radius:10px;margin-bottom:6px;font-size:13px}
.comment-form{display:flex;gap:8px;margin-top:8px}
.comment-form input{
 flex:1;padding:8px 12px;border-radius:20px;
 border:1px solid var(--border);background:var(--bg);font-size:13px;
}
.navbar{
 position:fixed;bottom:0;left:0;right:0;
 background:var(--card);border-top:1px solid var(--border);
 display:flex;justify-content:space-around;padding:8px 3px;z-index:20;
}
.navbar button{
 border:0;background:none;color:var(--muted);font-size:11px;
 display:flex;flex-direction:column;align-items:center;gap:3px;
}
.navbar button.active{color:var(--blue);font-weight:bold}
main{padding-bottom:85px}
.page-title{font-size:20px;color:var(--blue);margin:6px 0 15px}
.profile-cover{height:130px;background:linear-gradient(120deg,#1877f2,#60a5fa);border-radius:12px}
.profile-info{text-align:center;margin-top:-42px}
.profile-info .avatar{width:84px;height:84px;margin:auto;border:4px solid var(--card);font-size:26px}
.stats{display:flex;justify-content:space-around;text-align:center;margin:18px 0}
.stats strong{display:block;color:var(--blue);font-size:18px}
.stats small{color:var(--muted);font-size:12px}
.menu-item{
 padding:14px 6px;border-bottom:1px solid var(--border);
 cursor:pointer;display:flex;align-items:center;justify-content:space-between;
}
.menu-item:last-child{border:0}
.chat-row{
 display:flex;align-items:center;gap:12px;padding:12px 4px;
 border-bottom:1px solid var(--border);cursor:pointer;
}
.chat-row:last-child{border:0}
.chat-row .details{flex:1}
.chat-row small{color:var(--muted)}
.chat-window{display:flex;flex-direction:column;height:62vh}
.chat-messages{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.msg-bubble{max-width:75%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.4}
.msg-sent{background:var(--blue);color:white;align-self:flex-end;border-bottom-right-radius:3px}
.msg-recv{background:var(--light);color:var(--text);align-self:flex-start;border-bottom-left-radius:3px}
.chat-input-bar{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--border)}
.chat-input-bar input{flex:1;padding:11px 14px;border:1px solid var(--border);border-radius:22px;background:var(--bg)}
.modal{
 position:fixed;inset:0;background:rgba(0,0,0,0.65);
 display:grid;place-items:center;z-index:40;padding:15px;
}
.modal-content{background:var(--card);width:100%;max-width:420px;border-radius:14px;padding:18px}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
#toast{
 position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
 background:#172b4d;color:white;padding:10px 18px;border-radius:10px;
 z-index:50;display:none;font-size:13px;
}
@media(min-width:700px){
 .container{padding:22px}
 .home-layout{display:grid;grid-template-columns:1fr 300px;gap:18px}
}
</style>
</head>

<body>

<header>
 <div class="brand">
  <div class="logo">MK</div>
  ADAM MK CHAT
 </div>
 <div class="header-actions hidden" id="headerActions">
  <button onclick="showPage('notifications')" title="Notifications">
   <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
  </button>
  <button onclick="showPage('messages')" title="Messages">
   <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  </button>
 </div>
</header>

<!-- REGISTER -->
<section id="register" class="container auth">
 <div class="card">
  <h2>Create Account</h2>
  <p>Join ADAM MK CHAT and connect with the world.</p>

  <div class="form-group">
   <label>Full Name</label>
   <input id="regName" placeholder="Enter your full name">
  </div>

  <div class="form-group">
   <label>Username</label>
   <input id="regUsername" placeholder="e.g. adammk">
  </div>

  <div class="form-group">
   <label>Email Address</label>
   <input id="regEmail" type="email" placeholder="Enter your email">
  </div>

  <div class="form-group">
   <label>Password</label>
   <input id="regPassword" type="password" placeholder="At least 6 characters">
  </div>

  <button class="primary" onclick="registerUser()">Create Account</button>

  <div class="auth-footer">
   Already have an account?
   <span class="link" onclick="showAuth('login')">Login</span>
  </div>
 </div>
</section>

<!-- LOGIN -->
<section id="login" class="container auth hidden">
 <div class="card">
  <h2>Welcome Back!</h2>
  <p>Login to your ADAM MK CHAT account.</p>

  <div class="form-group">
   <label>Email Address</label>
   <input id="loginEmail" type="email" placeholder="Enter your email">
  </div>

  <div class="form-group">
   <label>Password</label>
   <input id="loginPassword" type="password" placeholder="Password">
  </div>

  <button class="primary" onclick="loginUser()">Login</button>

  <div class="auth-footer">
   New here?
   <span class="link" onclick="showAuth('register')">Create Account</span>
  </div>
